<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТендерПульс - трекер заказов</title>
<link href="vendor/bootstrap.min.css" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#main">Перейти к содержимому</a>

<svg width="0" height="0" class="svg-defs" aria-hidden="true">
<defs>
<symbol id="i-bell" viewBox="0 0 16 16"><path d="M8 1a5 5 0 0 0-5 5v3L1.5 11h13L13 9V6a5 5 0 0 0-5-5zm-2 12h4a2 2 0 0 1-4 0z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
<symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
<symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="i-x" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="i-out" viewBox="0 0 16 16"><path d="M9 2H3v12h6M6 8h7M11 5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-link" viewBox="0 0 16 16"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1 1M9.5 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1-1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
<symbol id="i-trash" viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2h4v2M4 4l1 10h6l1-10M6.5 7v4M9.5 7v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-edit" viewBox="0 0 16 16"><path d="M11 2.5 13.5 5 5.5 13H3v-2.5l8-8z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></symbol>
<symbol id="i-check" viewBox="0 0 16 16"><path d="M2.5 8.5 6.5 12.5 13.5 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs>
</svg>

<!-- Экран входа -->
<section id="login-view" class="login-wrap" hidden>
  <div class="login-box">
    <p class="brand">ТендерПульс</p>
    <h1>Вход в трекер заказов</h1>
    <p class="muted">Агентство ведет закупки и тендеры клиентов. Войдите, чтобы видеть свою работу.</p>
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="login-email">Почта</label>
        <input class="form-control" id="login-email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="login-password">Пароль</label>
        <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button class="btn btn-primary w-100" type="submit" id="login-submit">Войти</button>
    </form>
    <div class="demo-block">
      <p class="muted">Быстрый вход (демо):</p>
      <div class="demo-btns" id="demo-box"></div>
      <p class="muted" id="demo-hint" hidden></p>
    </div>
  </div>
</section>

<!-- Приложение -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <p class="brand">ТендерПульс</p>
      <nav class="mainnav" aria-label="Разделы">
        <button class="navbtn" type="button" data-route="home">Главная</button>
        <button class="navbtn" type="button" data-route="orders">Заказы</button>
        <button class="navbtn" type="button" data-route="clients" data-staff>Клиенты</button>
      </nav>
      <form class="topsearch" id="topsearch-form" role="search">
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <label class="visually-hidden" for="topsearch-input">Быстрый поиск</label>
        <input id="topsearch-input" type="search" placeholder="Номер, заказ, клиент" autocomplete="off">
      </form>
      <button class="iconbtn bell" type="button" id="bell" aria-label="Уведомления">
        <svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg>
        <span class="bell-count" id="bell-count" hidden>0</span>
      </button>
      <span class="who" id="who"></span>
      <button class="iconbtn" type="button" id="logout" aria-label="Выйти из аккаунта">
        <svg class="ic" aria-hidden="true"><use href="#i-out"/></svg>
      </button>
    </div>
    <div class="topsearch-results" id="topsearch-results" hidden></div>
  </header>

  <main id="main" class="container-fluid">
    <section id="view-home" data-view="home" hidden></section>
    <section id="view-orders" data-view="orders" hidden></section>
    <section id="view-clients" data-view="clients" hidden></section>
    <section id="view-notify" data-view="notify" hidden></section>
  </main>
</div>

<!-- Drawer заказа -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Карточка заказа" hidden>
  <div class="drawer-head">
    <button class="iconbtn" type="button" id="drawer-close" aria-label="Закрыть карточку заказа">
      <svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>
    </button>
    <h2 id="drawer-title">Заказ</h2>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- Модалка создания заказа -->
<div class="modal fade" id="order-modal" tabindex="-1" aria-labelledby="order-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="order-create-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="order-modal-title">Новый заказ</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="nc-title">Название</label>
            <input class="form-control" id="nc-title" required>
            <p class="field-error" data-err="nc-title" hidden></p>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nc-client">Клиент</label>
            <select class="form-select" id="nc-client" required></select>
            <p class="field-error" data-err="nc-client" hidden></p>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nc-exec">Исполнитель</label>
            <select class="form-select" id="nc-exec"><option value="">Пока без исполнителя</option></select>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="nc-stage-due">Срок этапа</label>
              <input class="form-control mono" id="nc-stage-due" type="date" required>
              <p class="field-error" data-err="nc-stage-due" hidden></p>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="nc-amount">Бюджет, ₽</label>
              <input class="form-control mono" id="nc-amount" type="number" min="0" step="1000" placeholder="0">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="nc-desc">Описание</label>
            <textarea class="form-control" id="nc-desc" rows="3"></textarea>
          </div>
          <p class="form-error" id="nc-error" role="alert" hidden></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary" id="nc-submit">Создать заказ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Модалка клиента -->
<div class="modal fade" id="client-modal" tabindex="-1" aria-labelledby="client-modal-title" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="client-form" novalidate>
        <div class="modal-header">
          <h2 class="modal-title" id="client-modal-title">Новый клиент</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="cf-id">
          <div class="mb-3">
            <label class="form-label" for="cf-name">Название</label>
            <input class="form-control" id="cf-name" required>
            <p class="field-error" data-err="cf-name" hidden></p>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="cf-contact">Контактное лицо</label>
              <input class="form-control" id="cf-contact">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="cf-status">Статус</label>
              <select class="form-select" id="cf-status">
                <option value="active">Активен</option>
                <option value="archived">В архиве</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label" for="cf-email">Почта</label>
              <input class="form-control" id="cf-email" type="email">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label" for="cf-phone">Телефон</label>
              <input class="form-control mono" id="cf-phone" type="tel">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="cf-note">Заметка</label>
            <textarea class="form-control" id="cf-note" rows="2"></textarea>
          </div>
          <p class="form-error" id="cf-error" role="alert" hidden></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary" id="cf-submit">Сохранить</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
